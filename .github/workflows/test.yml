name: test

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install on a clean machine
        run: ./install.sh
      - name: Check fzf is new enough and gboard runs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fzf --version
          mkdir demo && cd demo && git init -q
          printf '#!/bin/sh\necho "+--- Project '"'"':app'"'"'"\n' > gradlew && chmod +x gradlew
          gboard help
          gboard print clean assembleDebug
