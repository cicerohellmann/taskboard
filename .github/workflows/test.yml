name: test

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh

  # Real fzf in a real terminal (tmux): the oldest fzf tb takes on Linux, the newest on macOS
  tty:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux and fzf 0.46.0
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y tmux
          mkdir -p "$HOME/fzf"
          curl -fsSL https://github.com/junegunn/fzf/releases/download/0.46.0/fzf-0.46.0-linux_amd64.tar.gz | tar -xz -C "$HOME/fzf"
          echo "FZF=$HOME/fzf/fzf" >> "$GITHUB_ENV"
      - name: Install tmux and fzf
        if: runner.os == 'macOS'
        run: brew install tmux fzf
      - run: tests/tty.sh

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install on a clean machine
        run: ./install.sh
      - name: Check fzf is new enough and tb runs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fzf --version
          mkdir demo && cd demo && git init -q
          printf '#!/bin/sh\necho "+--- Project '"'"':app'"'"'"\n' > gradlew && chmod +x gradlew
          tb help
          tb print clean assembleDebug
